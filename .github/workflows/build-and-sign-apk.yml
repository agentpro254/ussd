name: Build and Sign Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build and Sign APK
        run: |
          # Try to build with gradle wrapper first
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Sign APK (if not signed by Gradle)
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" 2>/dev/null | head -1)
          fi
          if [ -f "$APK_PATH" ]; then
            if jarsigner -verify "$APK_PATH" 2>/dev/null; then
              echo "APK is already signed"
              cp "$APK_PATH" app-release-signed.apk
            else
              echo "APK not signed, signing now..."
              UNSIGNED_APK=$(find . -path "*/build/outputs/apk/release/*-unsigned.apk" 2>/dev/null | head -1)
              if [ -z "$UNSIGNED_APK" ]; then
                UNSIGNED_APK="$APK_PATH"
              fi
              jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
                -keystore keystore.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
                -keypass ${{ secrets.KEY_PASSWORD }} "$UNSIGNED_APK" \
                ${{ secrets.KEY_ALIAS }}
              zipalign -v -p 4 "$UNSIGNED_APK" app-release-signed.apk
            fi
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app-release-signed.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app-release-signed.apk
          generate_release_notes: true