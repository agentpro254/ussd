name: Build and Sign Android APK

permissions:
  contents: write    # Required for creating releases
  actions: read      # Required for reading workflow status
  checks: read       # Required for reading check runs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.p12

      - name: Build APK
        run: |
          gradle assembleRelease

      - name: Rename APK
        run: |
          APK_NAME="app-v1.0.0-${{ github.run_number }}.apk"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/*.apk "${APK_NAME}"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 7

      - name: Create GitHub Release
        if: github.event.inputs.build_type == 'release' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}